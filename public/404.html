<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Crescer+</title>
    <script>
      // Restaura uma rota SPA depois que o GitHub Pages entrega o fallback 404.
      const redirect = sessionStorage.redirect;
      delete sessionStorage.redirect;
      if (redirect && redirect !== location.href) history.replaceState(null, null, redirect);
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script>
      sessionStorage.redirect = location.href;
      const projectPath = '/PROJETO_ONLINE_CRESCER';
      const currentPath = location.pathname || '/';
      const basePath = currentPath === projectPath || currentPath.startsWith(`${projectPath}/`) ? projectPath : '';
      location.replace(`${location.origin}${basePath}/`);
    </script>
  </body>
</html>
